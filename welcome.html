<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>複製歌詞搬到右鍵選單了 — 日文歌詞下載</title>
  <link rel="stylesheet" href="welcome.css">
</head>
<body>
  <main>
    <div class="brand"><img src="icon.png" width="32" height="32" alt="">日文歌詞下載 <span>新版使用說明</span></div>
    <p class="eyebrow">新的複製方式</p>
    <h1>複製歌詞，<br>現在按右鍵就好。</h1>
    <p class="intro">原本右上角的複製按鈕已移到網站的右鍵選單。<br>打開 UtaTen 歌詞頁，就能選擇你需要的格式。</p>
    <section aria-labelledby="steps-title">
      <h2 id="steps-title">三步驟，帶走歌詞</h2>
      <ol>
        <li><strong>開啟 UtaTen 歌詞頁</strong><span>等待歌詞載入完成。</span></li>
        <li><strong>在網頁空白處按滑鼠右鍵</strong><span>找到「複製歌詞」選單。</span></li>
        <li><strong>選擇格式，即可複製</strong><span>漢字有讀音（HTML）、漢字無讀音或全假名。</span></li>
      </ol>
    </section>
    <p class="note">只有 UtaTen 歌詞頁會顯示「複製歌詞」。若歌詞頁在更新前就已開啟，請先重新整理。HTML 模式的字體大小為 5。</p>
    <div class="actions"><a href="https://utaten.com/">前往 UtaTen <span aria-hidden="true">↗</span></a><button id="dismiss" type="button">知道了，關閉說明</button></div>
    <p class="footer">這份提示只會自動顯示一次。之後直接在歌詞頁按右鍵即可。</p>
  </main>
